# kalshi-rebalancer-live configuration
# Secrets (API key id, private key path) do NOT go here — see .env.
# This file holds strategy/risk parameters only, and is safe to commit.
#
# _live variant: Stage 1 only keeps events settling by the end of the
# current UTC calendar day (scanner/filters.py's end_of_day_utc) — there is
# no configurable horizon here, unlike the sibling kalshi_market_rebalancing_arbitrage
# project's scanner.max_days_to_close.

kalshi:
  base_url: "https://external-api.kalshi.com/trade-api/v2"
  ws_url: "wss://external-api-ws.kalshi.com/trade-api/ws/v2"
  request_timeout_s: 10
  max_retries: 3

scanner:
  min_outcome_legs: 2                   # Stage 1: N floor
  max_outcome_legs: 6                   # Stage 1: N cap
  min_depth_contracts: 1                # one-contract canary: require the quantity execution can actually submit, not an unrelated 25-contract floor
  rescan_interval_s: 300                # how often Stage 1 re-runs to refresh Stage 3's WS subscription set (5 min — Kalshi's public GET endpoints aren't metered, and a full pass takes seconds, well under this)
  orderbook_depth: 5                    # book depth to request per leg in Stage 2's --once REST summary (only need top-of-book)
  max_ws_legs: 1000                     # normally covers the full active same-day universe; status reports events omitted if this ceiling is reached
  max_quote_age_ms: 300000              # ordered WS deltas keep unchanged books current; reconnect/gap invalidation and the 5-minute snapshot rebuild are the freshness boundaries

arb:
  buy_basket_max_cost_usd: 0.98         # sum(ask_i) + sum(fee_i) must be below this to flag a buy-basket opportunity — the only direction implemented, see scanner/basket.py

logging:
  level: "INFO"
  opportunities_log_path: "data/opportunities.jsonl"   # append-only, one JSON line per detected opportunity
  status_path: "data/scanner_status.json"              # overwritten each cycle/heartbeat — what stream/monitor.py is currently watching; read by ui/app.py

execution:
  enabled: true                                                 # ARMED for demo-account execution — target below is "demo" (paper money)
  target: "demo"                                                # "demo" (paper money) or "prod" (REAL MONEY, real Kalshi account — see execution/executor.py's module docstring before ever setting this to prod)
  demo_base_url: "https://external-api.demo.kalshi.co/trade-api/v2" # separate account/book from kalshi.base_url above — see execution/executor.py
  orders_log_path: "data/orders.jsonl"                          # append-only, one JSON line per leg order attempt ("kind": "basket" or "unwind")
  risk_state_path: "data/risk_state.json"                       # durable breaker, exposure, and bot-owned position/order state
  circuit_breaker_max_mismatches: 1                             # first leg mismatch durably disables execution
  max_order_size_contracts: 1                                   # caps every leg's requested size regardless of the opportunity's computed max_size — deliberately small (2026-08-26: first-ever real-money capability, ramp up from here manually, not automatically)
  require_rest_confirmation: false                              # 2026-11-09: DEMO flip. REST confirmation refuses every detection because edge lifetime < REST roundtrip (proven 2026-11-08: WS and REST books byte-identical, the "divergence" was the edge dying in the ~300-500ms RTT, not a bad book). With min_edge_stability_ticks below gating on multi-tick persistence (and the close-time guard + unwind cap), WS pricing is now the live signal we actually trade on. config/loader.py still REFUSES to load with target: prod while this is false.
  prod_unconfirmed_orders_acknowledged: false                    # 2026-08-28: deliberate. REST confirmation refused 13/13 detections, so no order ever reached the exchange and the run could not distinguish "no edge" from "never tested". Submitting on WS prices to obtain one ground-truth fill. Bounded: 1 contract, 3 attempts, breaker trips on first mismatch, $23 account.
  prod_enabled: false                                           # off while target is "demo" — also means a future flip of target alone back to "prod" is not enough to arm real money; prod also requires account/env/webhook safeguards and CLI confirmation
  max_gross_exposure_usd: 25                                    # hard account-wide strategy exposure ceiling
  max_event_exposure_usd: 5                                     # hard exposure ceiling for a single event
  max_daily_notional_usd: 50                                    # conservative UTC-day turnover reserve: entry cost plus worst-case full unwind turnover
  max_daily_loss_usd: 3                                         # hard UTC-day realized loss ceiling
  max_open_orders: 12                                           # maximum bot-owned orders that may remain open
  max_orders_per_minute: 20                                     # submission-rate ceiling, including unwind orders
  max_baskets_per_session: 3                                    # canary-first: at most one basket attempt per process
  max_baskets_per_day: 3                                        # durable UTC-day attempt ceiling across restarts
  event_cooldown_s: 86400                                       # durable no-retry window per exact event
  max_unwind_loss_usd: 0.50                                     # reject unless observed exit depth bounds a full partial-fill unwind to this loss. Raised 0.10 -> 0.25 on 2026-08-28 (per-order fee rounding at size=1 costs 0.04-0.12 alone), then 0.25 -> 0.50 on 2026-11-08 after the first live buy_all_no detection cleared REST confirm but was refused at 0.32-0.34 estimate — the earlier ceiling was still tighter than any size-1 esports basket with wide-spread legs can clear. Worst realistic single-basket loss ~$0.35 on the $23 demo = 1.5%. Revisit alongside max_order_size_contracts before prod; a larger size amortizes rounding and lowers this estimate on the same basket.
  allow_no_direction: true                                      # 2026-11-03: arms buy_all_no (Phase B) for the demo account, same risk gates as buy_basket (see execution/executor.py's NoDirectionNotAllowedError, scanner/basket.py's compute_no_opportunity)
  min_edge_stability_ticks: 3                                   # 2026-11-09: require the WS edge to persist >=3 consecutive ticks on the same event before firing. At typical Kalshi WS tick rates this is ~150-400ms of persistence, which empirically clears flicker edges that could not have survived a REST round trip anyway. Pair with require_rest_confirmation: false above — this is the WS-native replacement for the REST corroboration gate.
  min_seconds_to_event_close: 300                               # 2026-11-09: refuse baskets within 5 minutes of settlement. Nov 4 incident shape: a basket fired 6+ hours past settle had leg BB reject (no resting volume) and no unwind could fill — the market was dead. A 5-min buffer leaves room for unwind to execute while the book is still alive.
  process_lock_path: "data/execution.lock"                      # prevents concurrent armed scanner processes
  alerts_log_path: "data/alerts.jsonl"                         # local incident stream; prod also requires Telegram or a generic webhook
